title: AI-generated images of missing 4yo Gus raise legal concerns (ABC)
media_type: text/markdown
abstract: 'After four-year-old Gus disappears from a South Australia outback homestead
  near Yunta, Facebook pages push AI images of him — a blonde child loaded into a
  four-wheel drive (“Is this a kidnapping case?”), fake “breakthroughs,” even a “miracle
  in the outback” reunion with US-style police uniforms. Posts rack up hundreds/thousands
  of reactions; experts flag family trauma, false hope, and trust collapse. Flinders
  law lecturer Joel Lisk: emotional harm + clickbait; RMIT’s Michael Cowling names
  the uncanny valley tell (hands, lighting). The copy invents a kidnapping the search
  never found.'

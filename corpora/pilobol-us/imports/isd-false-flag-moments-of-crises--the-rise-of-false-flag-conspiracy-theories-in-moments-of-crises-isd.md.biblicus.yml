title: The rise of false flag conspiracy theories in moments of crises (ISD)
media_type: text/markdown
abstract: '“False flag” claims on X rose >1,100% over five years; ~350% spike Apr–Jun
  2025 after DC/Boulder attacks and Israel–Iran escalation (~1m mentions Apr 26–Jun
  26). Pattern: high-engagement posts within hours frame real attacks as staged; older
  false-flag lore (9/11, Oct 7, etc.) recycled as “historical pattern.” Authors tie
  traction to trust collapse + news-influencer ecosystem; Community Notes lagged.
  Living specimen of a recurring **post-event narrative template**.'

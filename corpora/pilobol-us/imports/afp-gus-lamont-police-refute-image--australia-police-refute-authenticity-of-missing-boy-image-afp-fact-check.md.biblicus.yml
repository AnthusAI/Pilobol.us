title: Australia police refute authenticity of missing-boy image (AFP Fact Check)
media_type: text/markdown
abstract: Instagram/Facebook “potential breakthrough” posts (Celebrity Today, ~200k
  followers) collage a man carrying a curly-haired child into a car ~100km from Yunta
  as a “crucial lead.” SA Police tell AFP the carrying image is “not factual”; warped
  fingers and a floating ghost-tree give the AI away. Real Gus photo and real search
  photos are mixed in as bait. Police urge official channels only while Missing Persons
  takes the long case.

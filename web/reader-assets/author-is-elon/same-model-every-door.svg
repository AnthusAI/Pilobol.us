<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <rect width="1200" height="660" fill="#f1ead9"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#211d17">
    <text x="60" y="72" font-size="38">One applicant, five employers</text>
    <text x="60" y="104" font-size="21" fill="#6b6153">What changes when every firm rents the same AI to read résumés</text>
  </g>

  <text x="60" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#211d17">Five hiring managers</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="19" text-anchor="middle">
    <g fill="#f7f2e6" stroke="#cabd9f" stroke-width="3">
      <rect x="60" y="190" width="200" height="110" rx="6"/>
      <rect x="280" y="190" width="200" height="110" rx="6"/>
      <rect x="500" y="190" width="200" height="110" rx="6"/>
      <rect x="720" y="190" width="200" height="110" rx="6"/>
      <rect x="940" y="190" width="200" height="110" rx="6"/>
    </g>
    <g fill="#211d17">
      <text x="160" y="232">a different reader</text>
      <text x="380" y="232">a different reader</text>
      <text x="600" y="232">a different reader</text>
      <text x="820" y="232">a different reader</text>
      <text x="1040" y="232">a different reader</text>
    </g>
    <g fill="#3f5d43">
      <text x="160" y="272">interview</text>
      <text x="380" y="272" fill="#a35a2a">rejected</text>
      <text x="600" y="272">interview</text>
      <text x="820" y="272">interview</text>
      <text x="1040" y="272" fill="#a35a2a">rejected</text>
    </g>
  </g>

  <text x="60" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#211d17">Five firms renting the same AI model</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="19" text-anchor="middle">
    <g fill="#f7f2e6" stroke="#a35a2a" stroke-width="3" stroke-dasharray="9 7">
      <rect x="60" y="400" width="200" height="110" rx="6"/>
      <rect x="280" y="400" width="200" height="110" rx="6"/>
      <rect x="500" y="400" width="200" height="110" rx="6"/>
      <rect x="720" y="400" width="200" height="110" rx="6"/>
      <rect x="940" y="400" width="200" height="110" rx="6"/>
    </g>
    <g fill="#211d17">
      <text x="160" y="442">the same model</text>
      <text x="380" y="442">the same model</text>
      <text x="600" y="442">the same model</text>
      <text x="820" y="442">the same model</text>
      <text x="1040" y="442">the same model</text>
    </g>
    <g fill="#a35a2a">
      <text x="160" y="482">rejected</text>
      <text x="380" y="482">rejected</text>
      <text x="600" y="482">rejected</text>
      <text x="820" y="482">rejected</text>
      <text x="1040" y="482">rejected</text>
    </g>
  </g>

  <line x1="60" y1="556" x2="1140" y2="556" stroke="#d7cbb2" stroke-width="2"/>
  <text x="60" y="598" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#211d17">One biased manager affects one application. A biased model affects all of them.</text>
  <text x="60" y="632" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#8d8065">Illustration of the argument, not data from the study.</text>
</svg>

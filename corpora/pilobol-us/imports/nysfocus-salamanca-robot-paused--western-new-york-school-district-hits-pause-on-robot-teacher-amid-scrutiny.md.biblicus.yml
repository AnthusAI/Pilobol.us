title: Western New York School District Hits Pause on Robot Teacher Amid Scrutiny
media_type: text/markdown
abstract: 'Hours after NYSED Commissioner Betty Rosa warns about “robots that resemble
  humans” in a high-school classroom, Salamanca pauses the Realbotix Sally pilot for
  “enhanced student data privacy agreements” and community outreach. NYSUT president:
  “a robot built by a company associated with sex dolls has no business in our classrooms.”
  Physical unit never deployed. Companion to launch report: `nysfocus-salamanca-realbotix-sally.md`.'

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diffusion-Limited Aggregation</title>
<link rel="stylesheet" href="../css/markus-vendor.css">
<link rel="stylesheet" href="../css/site-theme.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--markus-paper, #14170f); }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="pilo-physarum-bg"></canvas>
<script>
  (() => {
    const variants = ['frost', 'coral', 'rootlets'];
    const requested = new URLSearchParams(window.location.search).get('fxVariant');
    const variant = variants.includes(requested) ? requested : null;
    window.__piloFxConfig = Object.freeze({
      effect: 'dla-v1', preset: 'gallery', presetLabel: 'Gallery',
      effects: variant ? { dla: { preset: variant } } : {},
      intensity: 0.68, motionScale: 0.62, seedRegions: [],
      theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    });
  })();
</script>
<script src="dla-v1.js"></script>
</body>
</html>

title: "False claims about missing Gus Lamont spread on social media (AAP FactCheck)"
media_type: text/markdown
abstract: "Engagement-bait pages (Vietnam-managed) claim Gus found alive, hidden cave, soaked backpack “breakthrough,” Minions shirt, bloodstains/body part, shimmering green item — all false. One page posts an AI-looking “kidnap into vehicle” still with an unnaturally long finger. SA Police Assistant Commissioner Ian Parrott: “no trace… no tangible pieces of evidence.” The feed invents a whole investigation "

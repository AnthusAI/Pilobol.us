title: 'Expert: AI image of missing Gus “concerning but not surprising” (ABC)'
media_type: text/markdown
abstract: 'Facebook circulates an AI image of a curly-haired boy being put into a
  4WD beside Gus’s real released photo. University of Sydney AI ethicist Rebecca Johnson:
  clickbait farms exploit the stress void. SA Commissioner for Victims’ Rights Sarah
  Quick: “extra layer of trauma” for the family, “very real consequences” for community
  and searchers. SA Police: only trust official images. Earlier, Facebook’s own AI
  search had already spat wrong answers about the case — the platform’s answer-engine
  joins the rumor.'

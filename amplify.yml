version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Papyrus's markus_renderer only imports stdlib -- it does not need
        # Papyrus's own (broken, non-CI-installable) pip package. Cloning
        # its source at a pinned commit and pointing PAPYRUS_ROOT at it is
        # all build_via_papyrus.py actually needs.
        - git clone --depth 1 https://github.com/AnthusAI/Papyrus.git /tmp/papyrus-src
        - cd /tmp/papyrus-src && git fetch --depth 1 origin d664fc7a397b578155df38068ed1a8967d4dc69f && git checkout d664fc7a397b578155df38068ed1a8967d4dc69f
        - pip install "git+https://github.com/AnthusAI/Markus@v0.5.1"
    build:
      commands:
        - cd web && PAPYRUS_ROOT=/tmp/papyrus-src python3 build_via_papyrus.py
  artifacts:
    baseDirectory: web/dist-papyrus
    files:
      - '**/*'
  cache:
    paths: []
# HTML must not sit on CloudFront for a year -- the first deploy shipped
# s-maxage=31536000 and the homepage stayed on stale content after new
# stories landed in git.
customHeaders:
  - pattern: '**/*.html'
    headers:
      - key: Cache-Control
        value: 'public, max-age=0, s-maxage=60, must-revalidate'
  - pattern: '/'
    headers:
      - key: Cache-Control
        value: 'public, max-age=0, s-maxage=60, must-revalidate'

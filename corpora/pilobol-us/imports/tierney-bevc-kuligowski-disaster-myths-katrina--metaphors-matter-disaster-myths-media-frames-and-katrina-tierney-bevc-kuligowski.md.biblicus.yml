title: 'Metaphors Matter: Disaster Myths, Media Frames, and Katrina (Tierney, Bevc
  & Kuligowski)'
media_type: text/markdown
abstract: Decades of field research show popular “disaster myths” (panic, widespread
  looting, social breakdown, passive victims) are largely false — survivors tend toward
  prosocial behavior. After Katrina, media framed victims via “civil unrest” then
  “urban warfare,” exaggerating lawlessness and feeding militarized response discourse.
  Classic specimen of how a focal crisis sprouts *wrong but sticky narrative templates*
  that steer policy.

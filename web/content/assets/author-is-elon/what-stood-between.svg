<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#f1ead9"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#211d17">
    <text x="60" y="72" font-size="38">What the reader could see</text>
    <text x="60" y="104" font-size="21" fill="#6b6153">A newspaper in 1897, a page of search results, and a setting called Auto today</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif">
    <g font-size="24" text-anchor="middle">
      <text x="430" y="170" fill="#3f5d43">New York Journal, 1897</text>
      <text x="700" y="170" fill="#6b6153">Search results</text>
      <text x="975" y="170" fill="#a35a2a">Cursor on Auto, 2026</text>
    </g>

    <g stroke="#d7cbb2" stroke-width="2">
      <line x1="60" y1="196" x2="1140" y2="196"/>
      <line x1="60" y1="316" x2="1140" y2="316"/>
      <line x1="60" y1="436" x2="1140" y2="436"/>
      <line x1="60" y1="556" x2="1140" y2="556"/>
    </g>

    <g font-size="22" fill="#211d17">
      <text x="60" y="248">Whose name</text><text x="60" y="278">is on it?</text>
      <text x="60" y="368">Does the reader</text><text x="60" y="398">choose it?</text>
      <text x="60" y="488">Is there another</text><text x="60" y="518">to compare?</text>
    </g>

    <g font-size="19" fill="#3f5d43" text-anchor="middle">
      <text x="430" y="248">Hearst's paper, printed</text><text x="430" y="274">across the top of every page</text>
      <text x="430" y="368">Yes. A penny,</text><text x="430" y="394">every morning</text>
      <text x="430" y="488">A rival paper, sold by</text><text x="430" y="514">the boy on the same corner</text>
    </g>

    <g font-size="19" fill="#6b6153" text-anchor="middle">
      <text x="700" y="248">Every link shows</text><text x="700" y="274">the website's name</text>
      <text x="700" y="368">Yes. The reader picks</text><text x="700" y="394">which link to open</text>
      <text x="700" y="488">Nine more links</text><text x="700" y="514">on the same page</text>
    </g>

    <g font-size="19" fill="#a35a2a" text-anchor="middle">
      <text x="975" y="248">No name on the answer</text>
      <text x="975" y="368">No. The setting picks</text><text x="975" y="394">which AI answers</text>
      <text x="975" y="488">No. One answer</text><text x="975" y="514">arrives by itself</text>
    </g>
  </g>

  <text x="60" y="604" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#8d8065">Drawn for this piece from the cases in the article.</text>
</svg>

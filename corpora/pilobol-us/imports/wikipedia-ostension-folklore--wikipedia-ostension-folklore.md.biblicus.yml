title: "Ostension (folklore) — legend enacted / misread as reality"
media_type: text/markdown
abstract: "**Ostension** = real-life happenings shaped by a pre-existing legend. Pure ostension acts the legend out; **pseudo-ostension** fabricates evidence/hoaxes to look like the legend; **quasi-ostension** misreads ambiguous evidence *as* the legend (many media panics). Dégh/Vázsonyi: “fact can become narrative and narrative can become fact.” Reverse ostension (Tolbert): invent folklore-like narrative wh"

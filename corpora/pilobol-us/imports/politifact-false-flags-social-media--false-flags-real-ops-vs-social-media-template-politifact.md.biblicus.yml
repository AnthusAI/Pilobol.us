title: 'False flags: real ops vs social-media template (PolitiFact)'
media_type: text/markdown
abstract: 'Confirmed historical false-flag *operations* exist (e.g. Gleiwitz 1939,
  Mukden 1931) but are outnumbered by baseless claims that *real* crises were staged.
  After 9/11 and Iraq WMD deception, “false flag” became a reusable interpretive frame
  (Sandy Hook “crisis actors,” Jan. 6, school shootings). Olmsted: proven government
  lies feed attraction; Radnitz: intuition that politicians exploit crises makes the
  frame plausible; Starbird: confusion between real threat and rumor is sometimes
  the point. Desk bridge: template ≠ history of ops (Gleiwitz already filed).'

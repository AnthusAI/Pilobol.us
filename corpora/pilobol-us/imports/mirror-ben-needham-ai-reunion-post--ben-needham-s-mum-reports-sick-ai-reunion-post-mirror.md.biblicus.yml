title: Ben Needham’s mum reports “sick” AI reunion post (Mirror)
media_type: text/markdown
abstract: 'Facebook page “Midnight Wire” posts a mock AI photo of missing Ben Needham
  (vanished Kos 1991) as a grown man with a child on his knee beside mum Kerry — caption
  “finally we are together” — then claims an “emotional face to face” after 35 years.
  Kerry is “distraught” and “horrified,” reports to South Yorkshire Police; sister
  Leighanna: false “found” claims harm the investigation and confuse genuine tips.
  The forensic age-progression image meant to aid the search becomes raw material
  for a fake reunion.'

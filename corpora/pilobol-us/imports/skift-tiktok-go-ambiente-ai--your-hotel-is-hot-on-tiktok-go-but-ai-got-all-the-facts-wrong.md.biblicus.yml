title: Your Hotel Is Hot on TikTok Go. But AI Got All The Facts Wrong.
media_type: text/markdown
abstract: 'AI-generated TikTok videos (and possibly AI “creators”) push Ambiente Sedona
  and other hotels through TikTok Go booking commissions (~5%). Owner Jennifer May:
  atrium suite and “peaceful pond” don’t exist; Resemble.AI flags the presenter as
  synthetic. Seventeen Sedona clips flagged ≥80% AI; only one labeled. Guests pay
  $1,300+/night into a feed that out-pictures the property.'

title: A Theory of Fads… as Informational Cascades (Bikhchandani, Hirshleifer & Welch)
media_type: text/markdown
abstract: An **informational cascade** starts when it is optimal for an individual,
  having seen predecessors’ *actions*, to follow them and ignore private information.
  Explains localized conformity *and* fragility — small shocks or a little new public
  information can reverse long-running mass behavior. When only previous actions are
  observable (not signals), cascades can be wrong yet brittle. Microfoundation under
  availability/conspiracy cascade talk.

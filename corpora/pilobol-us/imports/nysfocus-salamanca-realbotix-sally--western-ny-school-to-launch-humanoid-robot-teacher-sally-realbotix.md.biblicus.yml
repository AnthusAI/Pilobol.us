title: Western NY School To Launch Humanoid Robot Teacher (Sally / Realbotix)
media_type: text/markdown
abstract: 'Salamanca City Central School District (Seneca Nation reservation) approves
  ~$57,590 for Realbotix humanoid “Sally” — silicone skin, long brown hair, seated
  upper-body motion + laptop avatar — for high-school AI/robotics. Students authenticate
  by ID code so Sally continues yesterday’s chat; avatar available 24/7 for homework
  photos and 100+ language translation. Realbotix (ex-Tokens.com) acquired Simulcra/RealDoll
  parent; company says education and adult lines are separate. Goal stated: robots
  “indistinguishable from humans.” Pause follow-up: `nysfocus-salamanca-robot-paused.md`.'

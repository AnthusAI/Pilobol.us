<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f1ead9"/>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#211d17">
    <text x="60" y="72" font-size="38">One page of the mailer</text>
    <text x="60" y="104" font-size="21" fill="#6b6153">Six coupons, one of them chosen for the person holding it</text>
  </g>

  <g stroke="#cabd9f" stroke-width="3" stroke-dasharray="9 7" fill="#f7f2e6">
    <rect x="60"  y="150" width="330" height="170" rx="6"/>
    <rect x="415" y="150" width="330" height="170" rx="6"/>
    <rect x="770" y="150" width="330" height="170" rx="6"/>
    <rect x="60"  y="350" width="330" height="170" rx="6"/>
    <rect x="770" y="350" width="330" height="170" rx="6"/>
  </g>
  <rect x="415" y="350" width="330" height="170" rx="6" stroke="#a35a2a" stroke-width="4" stroke-dasharray="9 7" fill="#f7f2e6"/>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <g font-size="15" fill="#8d8065" letter-spacing="3">
      <text x="225" y="196">COUPON</text>
      <text x="580" y="196">COUPON</text>
      <text x="935" y="196">COUPON</text>
      <text x="225" y="396">COUPON</text>
      <text x="935" y="396">COUPON</text>
      <text x="580" y="396" fill="#a35a2a">COUPON</text>
    </g>
    <g font-size="30" fill="#211d17">
      <text x="225" y="248">Lawn mower</text>
      <text x="580" y="248">Wine glasses</text>
      <text x="935" y="248">Bath towels</text>
      <text x="225" y="448">Garden hose</text>
      <text x="935" y="448">Patio chairs</text>
      <text x="580" y="448" fill="#a35a2a">Crib</text>
    </g>
    <g font-size="17" fill="#6b6153">
      <text x="225" y="285">for nobody in particular</text>
      <text x="580" y="285">for nobody in particular</text>
      <text x="935" y="285">for nobody in particular</text>
      <text x="225" y="485">for nobody in particular</text>
      <text x="935" y="485">for nobody in particular</text>
      <text x="580" y="485" fill="#a35a2a">for a due date she never gave anyone</text>
    </g>
  </g>

  <g stroke="#d7cbb2" stroke-width="2">
    <line x1="60" y1="556" x2="1140" y2="556"/>
  </g>
  <text x="60" y="598" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#8d8065">Five of the six are camouflage. The mailer was built so the accuracy underneath it would never have to be explained.</text>
</svg>

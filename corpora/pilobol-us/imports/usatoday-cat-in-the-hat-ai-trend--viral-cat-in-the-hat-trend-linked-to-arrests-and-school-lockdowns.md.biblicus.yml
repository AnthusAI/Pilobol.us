title: Viral 'Cat in the Hat' trend linked to arrests and school lockdowns
media_type: text/markdown
abstract: 'AI-generated Cat in the Hat “sightings” (doorbell/driveway found footage)
  migrate from TikTok prank to U.S. school closures and arrests — Assumption High
  closed Aug 31; Florida teen charged over Paducah threats; Wexford Garda: “AI prompt,”
  Cat “not in your driveway.” Bodies and institutions move on a feed copy.'

<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    Seamless, directionless paper grain. The previous CSS used two crossed
    repeating lines; their exact angles and spacing formed a visible skewed
    grid. Turbulence gives every tile irregular fibre-scale variation while
    stitchTiles prevents a seam where tiles meet.
  -->
  <filter id="paper-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.48 0.36"
      numOctaves="4"
      seed="731"
      stitchTiles="stitch"
      result="noise"
    />
    <feColorMatrix
      in="noise"
      type="matrix"
      values="
        0 0 0 0 0.25
        0 0 0 0 0.19
        0 0 0 0 0.12
        0.045 0.045 0.045 0 -0.045
      "
    />
  </filter>
  <rect width="256" height="256" filter="url(#paper-grain)"/>
</svg>

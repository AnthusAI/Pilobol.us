title: An Analysis of Rumor (Allport & Postman)
media_type: text/markdown
abstract: 'Basic law of rumor: intensity ≈ importance × ambiguity (R ~ i × a) — multiplicative;
  if either factor is zero, no rumor. Wartime cases show rumor also thickens when
  news is *plentiful* and momentous (Pearl Harbor report, V-J Day, FDR death), not
  only when news is absent. Transmission distorts via leveling, sharpening, assimilation
  to the teller’s interests and stereotypes. Founding lane for “why big events sprout
  many unverified versions.”'

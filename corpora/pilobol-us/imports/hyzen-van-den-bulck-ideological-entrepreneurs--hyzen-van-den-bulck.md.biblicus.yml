title: "Conspiracies, Ideological Entrepreneurs, and Digital Popular Culture (Hyzen & Van den Bulck)"
media_type: text/markdown
abstract: "Conspiracy theories move margins→mainstream via **ideological entrepreneurs** (North/Storr lineage) who sell alternative world-explanations in upheaval, using digital-media and popular-culture affordances plus fandom-like audiences. Cases: Alex Jones / Infowars and QAnon. Complements Kuran/Sunstein’s “availability entrepreneurs” with a propaganda + celebrity + participatory-culture frame for who *"

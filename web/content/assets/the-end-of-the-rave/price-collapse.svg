<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f1ead9"/>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#211d17">
    <text x="60" y="72" font-size="38">What it took to put a name to one person</text>
    <text x="60" y="104" font-size="21" fill="#6b6153">Each documented case in this piece, in the order it happened</text>
  </g>

  <g stroke="#d7cbb2" stroke-width="2">
    <line x1="60" y1="556" x2="1140" y2="556"/>
  </g>

  <g stroke="#cabd9f" stroke-width="3" stroke-dasharray="7 9">
    <line x1="240" y1="178" x2="240" y2="262"/>
    <line x1="420" y1="262" x2="420" y2="326"/>
    <line x1="600" y1="326" x2="600" y2="382"/>
    <line x1="780" y1="382" x2="780" y2="438"/>
    <line x1="960" y1="438" x2="960" y2="506"/>
  </g>

  <g stroke="#3f5d43" stroke-width="9" stroke-linecap="round">
    <line x1="66" y1="178" x2="234" y2="178"/>
    <line x1="246" y1="262" x2="414" y2="262"/>
    <line x1="426" y1="326" x2="594" y2="326"/>
    <line x1="606" y1="382" x2="774" y2="382"/>
    <line x1="786" y1="438" x2="954" y2="438"/>
  </g>
  <line x1="966" y1="506" x2="1134" y2="506" stroke="#a35a2a" stroke-width="11" stroke-linecap="round"/>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <g font-size="31" fill="#211d17">
      <text x="150" y="160">1992</text>
      <text x="330" y="244">2009</text>
      <text x="510" y="308">2012</text>
      <text x="690" y="364">2018</text>
      <text x="870" y="420">2021</text>
      <text x="1050" y="486" fill="#a35a2a">2026</text>
    </g>
    <g font-size="18" fill="#6b6153">
      <text x="150" y="209">£4m in court,<tspan x="150" dy="23">no names at all</tspan></text>
      <text x="330" y="293">six years,<tspan x="330" dy="23">a newspaper</tspan></text>
      <text x="510" y="357">a side effect of<tspan x="510" dy="23">selling lotion</tspan></text>
      <text x="690" y="413">one genealogist,<tspan x="690" dy="23">a cousin's spit</tspan></text>
      <text x="870" y="469">a purchase order</text>
      <text x="1050" y="537" fill="#a35a2a">about a dollar a head</text>
    </g>
  </g>

  <text x="60" y="598" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#8d8065">Only the two ends carry published figures; the steps between are what the reporting says each case cost.</text>
</svg>

version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Cache lives under the project root (Amplify refuses absolute paths like /tmp).
        # Mirror Anth.us: cache compiler/tool inputs, never the finished HTML output.
        - mkdir -p .amplify-cache/pip
        - export PIP_CACHE_DIR="$PWD/.amplify-cache/pip"
        # Papyrus's markus_renderer only imports stdlib — clone its source at a
        # pinned commit. Reuse the checkout when the Amplify build cache restores it.
        - |
          PAPYRUS_PIN=d664fc7a397b578155df38068ed1a8967d4dc69f
          PAPYRUS_DIR="$PWD/.amplify-cache/papyrus-src"
          if [ ! -d "$PAPYRUS_DIR/.git" ]; then
            git clone --depth 1 https://github.com/AnthusAI/Papyrus.git "$PAPYRUS_DIR"
          fi
          # `git -C` — Amplify phases share one shell; bare `cd` leaks into build.
          git -C "$PAPYRUS_DIR" fetch --depth 1 origin "$PAPYRUS_PIN"
          git -C "$PAPYRUS_DIR" checkout "$PAPYRUS_PIN"
        - pip install --cache-dir "$PWD/.amplify-cache/pip" "git+https://github.com/AnthusAI/Markus@v0.5.1"
    build:
      commands:
        # Always rebuild HTML clean — do not restore web/dist-papyrus from cache
        # (same rule as Anth.us not caching Gatsby public/).
        # Requires ELEVENLABS_API_KEY in Amplify environment variables.
        - rm -rf web/dist-papyrus
        - cd web && PAPYRUS_ROOT="$PWD/../.amplify-cache/papyrus-src" python3 build_via_papyrus.py
  artifacts:
    baseDirectory: web/dist-papyrus
    files:
      - '**/*'
  cache:
    paths:
      - .amplify-cache/**/*

version: 1
frontend:
  phases:
    preBuild:
      commands:
        - pip install "git+https://github.com/AnthusAI/Markus@v0.5.0"
    build:
      commands:
        - cd web && python3 build.py
  artifacts:
    baseDirectory: web/dist
    files:
      - '**/*'
  cache:
    paths: []
# HTML must not sit on CloudFront for a year — the first deploy shipped
# s-maxage=31536000 and the homepage was stuck after content landed in git.
customHeaders:
  - pattern: '**/*.html'
    headers:
      - key: Cache-Control
        value: 'public, max-age=0, s-maxage=60, must-revalidate'
  - pattern: '/'
    headers:
      - key: Cache-Control
        value: 'public, max-age=0, s-maxage=60, must-revalidate'

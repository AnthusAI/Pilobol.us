title: Availability Cascades and Risk Regulation (Kuran & Sunstein)
media_type: text/markdown
abstract: 'An **availability cascade** is a self-reinforcing process of collective
  belief: an expressed perception triggers a chain reaction that makes the perception
  more plausible as it becomes more available in public discourse. Combines informational
  cascades (learn from others’ apparent beliefs) and reputational cascades (endorse
  to keep social acceptance). **Availability entrepreneurs** try to trigger cascades
  that advance their agendas (Love Canal, Alar, TWA 800 as cases). Names the snowball
  of “this reading of the event is everywhere, so it must be true.”'

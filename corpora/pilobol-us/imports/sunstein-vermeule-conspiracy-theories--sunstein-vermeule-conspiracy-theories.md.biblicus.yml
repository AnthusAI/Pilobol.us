title: "Conspiracy Theories: Causes and Cures (Sunstein & Vermeule)"
media_type: text/markdown
abstract: "Conspiracy theories often spread via informational, reputational, and availability cascade dynamics; they are **self-sealing** (attempts to rebut become further “proof”). Authors argue holders often have a “crippled epistemology” and controversially propose “cognitive infiltration” of extremist groups. Use for the cascade *mechanism* after focal events — not for endorsing the policy cure."

title: Fake AI images spark false claims in Gus Lamont search (7NEWS)
media_type: text/markdown
abstract: 'AI “blonde child into car / unfamiliar man ~100km from Yunta” post shared
  thousands of times; social users believe he had been found. Meta’s AI search on
  Facebook/Instagram returns false “answers” (toy found “with blood,” boy located
  alive). 7NEWS recreates similar images in moments. CAIDE’s Jeannie Marie Paterson:
  generative AI can “derail police investigations.” Parrott: no foul play evidence;
  believe he wandered off. Platform answer-engine + fake sighting = double fungus.'
